[package]
name = "pairproof"
version = "0.1.7"
edition = "2021"
description = "AI-native technical interviewing: expert/candidate CLI that evolves LeetCode-style interviews"
license = "Apache-2.0"
# Each tests/*.rs file would otherwise be its own crate. That rebuild is most of CI.
autotests = false

[[bin]]
name = "pairproof"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.1"

[dev-dependencies]

[profile.release]
lto = true
