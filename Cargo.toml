[package]
name = "pairproof"
version = "0.1.0"
edition = "2021"
description = "AI-native technical interviewing: expert/candidate CLI that evolves LeetCode-style interviews"
license = "MIT"

[[bin]]
name = "pairproof"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]

[profile.release]
lto = true
