name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time. A main release waits until CI has finished.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Wait for CI
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: CI passed
        shell: sh
        run: echo "CI succeeded, or this run is a tag or a manual dispatch"

  prepare:
    name: Plan version
    needs: gate
    if: always() && needs.gate.result == 'success' && github.event_name == 'workflow_run'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      bump: ${{ steps.plan.outputs.bump }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Plan release version
        id: plan
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          CURRENT="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          LATEST=""
          if TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null)"; then
            LATEST="${TAG#v}"
          fi
          PLAN="$(sh scripts/plan_release_version.sh "$CURRENT" "$LATEST")"
          VERSION="$(printf '%s' "$PLAN" | awk '{ print $1 }')"
          BUMP="$(printf '%s' "$PLAN" | awk '{ print $2 }')"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists; release not needed"
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "cargo=$CURRENT latest=${LATEST:-none} version=$VERSION bump=$BUMP release=$RELEASE"

  validate:
    name: Validate
    needs: gate
    if: always() && needs.gate.result == 'success' && github.event_name != 'workflow_run'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tag matches Cargo.toml version
        if: "startsWith(github.ref, 'refs/tags/')"
        shell: sh
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: tag '$TAG' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          }
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "error: could not extract CARGO_VERSION from Cargo.toml" >&2
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION"
          echo "CARGO_VERSION=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "error: tag version '$TAG_VERSION' does not match Cargo.toml version '$CARGO_VERSION'" >&2
            exit 1
          fi
      - name: Install Rust toolchain
        shell: sh
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      # Three hermetic orchestrator_sync tests shell out to the real
      # mutagen binary (absent-session paths); install it so they pass.
      - name: Install Mutagen
        shell: sh
        run: |
          set -eu
          curl -fsSL https://github.com/mutagen-io/mutagen/releases/download/v0.18.1/mutagen_linux_amd64_v0.18.1.tar.gz | tar -xz
          sudo install -m 0755 mutagen /usr/local/bin/mutagen
          sudo install -m 0644 mutagen-agents.tar.gz /usr/local/bin/mutagen-agents.tar.gz
          mutagen version
      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: [gate, validate, prepare]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      (needs.prepare.outputs.release == 'true' || (github.event_name != 'workflow_run' && needs.prepare.result == 'skipped'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            asset: pairproof-linux-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04
            asset: pairproof-linux-aarch64-unknown-linux-musl.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-14
            asset: pairproof-darwin-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: pairproof-darwin-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Apply planned version
        if: needs.prepare.outputs.bump == 'true'
        shell: sh
        run: sh scripts/set_cargo_version.sh "${{ needs.prepare.outputs.version }}"
      - name: Install Rust toolchain
        shell: sh
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target "${{ matrix.target }}" --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install musl cross tools
        if: runner.os == 'Linux'
        shell: sh
        run: |
          set -eu
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
            # aarch64-linux-gnu-gcc is used only as the linker driver for
            # the aarch64 musl target; rustc still produces musl objects.
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package release asset
        shell: sh
        run: |
          set -eu
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/pairproof" staging/pairproof
          chmod 0755 staging/pairproof
          tar -czf "dist/${{ matrix.asset }}" -C staging pairproof
          if command -v sha256sum >/dev/null 2>&1; then
            HEX="$(sha256sum "dist/${{ matrix.asset }}" | awk '{ print $1 }')"
          else
            HEX="$(shasum -a 256 "dist/${{ matrix.asset }}" | awk '{ print $1 }')"
          fi
          printf '%s  %s\n' "$HEX" "${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          cat "dist/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [gate, validate, build, prepare]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_run')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: sh
        run: |
          set -eu
          ls -l dist
          sh scripts/check_release_assets.sh dist
      - name: Create GitHub release
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PLANNED_VERSION: ${{ needs.prepare.outputs.version }}
          PLANNED_BUMP: ${{ needs.prepare.outputs.bump }}
        run: |
          set -eu
          sh scripts/check_release_assets.sh dist
          if [ "$PLANNED_BUMP" = "true" ]; then
            sh scripts/set_cargo_version.sh "$PLANNED_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "Release v$PLANNED_VERSION"
            git push origin HEAD:main
            TAG="v$PLANNED_VERSION"
            git tag "$TAG"
            git push origin "$TAG"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="v$PLANNED_VERSION"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="$TAG_NAME"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "pairproof $TAG" --notes "pairproof $TAG" dist/pairproof-linux-x86_64-unknown-linux-musl.tar.gz dist/pairproof-linux-x86_64-unknown-linux-musl.tar.gz.sha256 dist/pairproof-linux-aarch64-unknown-linux-musl.tar.gz dist/pairproof-linux-aarch64-unknown-linux-musl.tar.gz.sha256 dist/pairproof-darwin-x86_64-apple-darwin.tar.gz dist/pairproof-darwin-x86_64-apple-darwin.tar.gz.sha256 dist/pairproof-darwin-aarch64-apple-darwin.tar.gz dist/pairproof-darwin-aarch64-apple-darwin.tar.gz.sha256
